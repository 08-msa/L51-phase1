<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Available Courses</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1>🎓 Explore Our Courses</h1>
      <p>Search by name or category to find what suits you best</p>
    </div>
  </header>

  <main class="container">
    <section class="search-section">
      <form id="searchForm" class="search-form">
        <input type="text" id="searchName" placeholder="Course Name" />
        <input type="text" id="searchCategory" placeholder="Category" />
        <button type="submit">🔍 Search</button>
      </form>
    </section>

    <section id="coursesContainer" class="course-grid">
      <div class="course-card">
        <h3>Web Development</h3>
        <p><strong>Category:</strong> Technology</p>
        <p><strong>Duration:</strong> 6 weeks</p>
      </div>
      <div class="course-card">
        <h3>Graphic Design</h3>
        <p><strong>Category:</strong> Art & Design</p>
        <p><strong>Duration:</strong> 4 weeks</p>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
